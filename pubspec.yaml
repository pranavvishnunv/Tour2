name: kerala_tourism_app
description: A comprehensive tourism coordination app for Kerala

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - Compatible versions
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^12.1.3
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  
  # Utilities
  url_launcher: ^6.2.4
  image_picker: ^1.0.7
  uuid: ^4.3.3
  intl: ^0.19.0
  
  # Loading and Error Handling
  flutter_spinkit: ^5.2.0
  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Comment out assets until you create the directories
  # assets:
  #   - assets/images/
  #   - assets/icons/
  
  # Comment out fonts until you add the font file
  # fonts:
  #   - family: Kerala
  #     fonts:
  #       - asset: fonts/Kerala-Regular.ttf