name: kerala_tourism_app
description: A comprehensive tourism coordination app for Kerala

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  
  # ✅ Firebase - Latest stable versions (compatible with Flutter 3.13+)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.6
  
  # State Management
  provider: ^6.1.2
  
  # Navigation
  go_router: ^16.2.0
  
  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.0
  
  # Utilities
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  
  # Loading and Error Handling
  flutter_spinkit: ^5.2.1
  fluttertoast: ^8.2.12   # ✅ fixed Kotlin API issues

  # Maps and Location - Migrated to OpenStreetMap
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.3.0
  latlong2: ^0.9.1
  osm_nominatim: ^4.0.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
  
  # Enable fonts when added
  # fonts:
  #   - family: Kerala
  #     fonts:
  #       - asset: fonts/Kerala-Regular.ttf
